<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Property</title>
    <link rel="stylesheet" href="checkbox.css">
</head>
<body>
    <input type="checkbox" id="myCheckbox">
    <label for="myCheckbox" id="myLabel">Subscribe</label> <br><br>

    <input type="radio" id="visaBtn" name="card">
    <label for="visaBtn" id="myLabels">Visa</label> <br><br>
    <input type="radio" id="masterBtn" name="card">
    <label for="masterBtn" id="myLabels">Master Card</label> <br><br>
    <input type="radio" id="paypalBtn" name="card">
    <label for="paypalBtn" id="myLabels">Paypal</label> <br><br>

    <button id="myButton" class="myButton" type="submit">Submit</button> <br><br>

    <p id="subresult"></p>
    <p id="cardresult"></p>

    <script src="checkbox.js"></script>
</body>
</html>
