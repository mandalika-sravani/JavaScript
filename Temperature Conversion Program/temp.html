<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion Program</title>
    <link rel="stylesheet" href="temp.css">
</head>
<body>
    <form id="form">
        <h1 id="h1">Temperature Conversion</h1>
        <input type="number" id="textbox" value="0"> <br><br>

        <input type="radio" id="toFahren" name="unit"> 
        <label for="toFahren" id="fclabel">Celsius ➡ Fahrenheit</label> <br><br>

        <input type="radio" id="toCel" name="unit">
        <label for="toCel" id="cflabel">Fahrenheit ➡ Celsius</label> <br><br>

        <button type="button" id="button" onclick="convert()">Submit</button> <br><br>

        <p id="result"></p>

    </form>
    
    <script src="temp.js"></script>
</body>
</html>
