<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller Program</title>

    <link rel="stylesheet" href="dice_roller.css">
</head>
<body>

    <div id="container">
        <h1 id="h1">Dice Roller</h1>
        <label id="number"># of Dice:</label>
        <input id="roll" type="number" value="1" min="1">
        <button id = "rollBtn" type="button" onclick="rollDice()">Roll Dice</button> <br>
        <div id="diceResult"></div>
        <div id="diceImages"></div>
    </div>

    <script src="dice_roller.js"></script>
</body>
</html>
