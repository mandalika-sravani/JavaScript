<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="image_slider.css">
</head>
<body>

    <div class="slider">
        <div class="slides">
            <img class="slide" src="image_1.jpeg" alt = "Image # 1">
           <!--<img class="slide" src="image_2.jpg" alt = "Image # 2"> --> 
            <img class="slide" src="image_3.jpeg" alt = "Image # 3">
            <img class="slide" src="image_4.jpeg" alt = "Image # 4">
        </div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
    </div>
    <script src="image_slider.js"></script>
</body>
</html>
